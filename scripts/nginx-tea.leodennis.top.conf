# Nginx site for tea-store (copy to /etc/nginx/sites-enabled/ on server).
# Medusa API + static on :9000; Next.js storefront on :8000.

server {
    listen 80;
    server_name tea.leodennis.top;

    location /.well-known/acme-challenge/ {
        root /var/www/ssl-proof/tea;
        allow all;
    }

    location ~ ^/(store|admin|auth|static|health|app)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
